name: Jagnor Clipping AI Company

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline Stage: full (build + publish), build (preview only), or publish"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - build
          - publish
      engine:
        description: "Business Engine to run"
        required: true
        default: "motion_story"
        type: choice
        options:
          - motion_story
          - ai_faceless
          - clipping
          - raw_video_drop
          - carousel_funnel
          - digital_product
          - b2b_agency
      title_or_topic:
        description: "[motion_story / ai_faceless] Leave BLANK to auto-pick a live trending topic (or type custom topic / product / client)"
        required: false
        default: ""
      notes_or_points:
        description: "[carousel / digital_product / b2b_agency] Slide points (separated by ;) or product/client notes"
        required: false
        default: ""
      price_usd:
        description: "[digital_product / b2b_agency ONLY] Sale price in USD (leave blank for video engines)"
        required: false
        default: ""
      theme:
        description: "[motion_story / ai_faceless] Content theme"
        required: true
        default: "Universal Storytelling"
        type: choice
        options:
          - Universal Storytelling
          - Trending Tech & AI
          - Space & Science
          - History & Mythology
          - Psychology & Self-Improvement
          - Finance & Business
          - Health & Medical Breakthroughs
          - Gaming & Pop Culture
          - Survival & Unexplained Mysteries
      character_desc:
        description: "[motion_story] Optional character idea (leave blank to auto-create universally)"
        required: false
        default: ""
      art_style:
        description: "[all video engines] Visual art style (use 'original' to match clipped video exactly)"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - dark_cinematic
          - anime
          - cyberpunk
          - 3d_pixar
          - comic_book
          - minimalist_sketch
          - oil_painting
      aspect_ratio:
        description: "[clipping / raw_video_drop] Output video aspect ratio"
        required: true
        default: "9:16"
        type: choice
        options:
          - "9:16"
          - "16:9"
          - "1:1"
          - "4:5"
      voice:
        description: "[all video engines] Narrator Voice & Mood (use 'original' for natural voice / original clip audio)"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - deep_male
          - serious_male
          - mysterious_male
          - happy_male
          - indian_storyteller_male
          - deep_female
          - serious_female
          - mysterious_female
          - happy_female
          - malayalam_mysterious_male
          - malayalam_female
          - hindi_serious_male
      niche_query:
        description: "[clipping] Niche keywords/hashtag to find trending videos"
        required: false
        default: "AI agents automation tech podcast"
      trend_platform:
        description: "[clipping] Source platform to scan for trending videos"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - youtube
          - instagram
      source_url:
        description: "[clipping] Optional specific YouTube or Instagram video URL"
        required: false
        default: ""
      allow_all_licenses:
        description: "[clipping] Override CC-only license check (ONLY if you own/have permission)"
        required: false
        default: false
        type: boolean
      skip_spacing_check:
        description: "[publish] Bypass minimum gap between posts"
        required: false
        default: false
        type: boolean
      dry_run_publish:
        description: "[publish] Dry-run social API calls (test mode)"
        required: false
        default: false
        type: boolean

  schedule:
    # Slot 1 (9:00 AM IST / 03:30 UTC): 1x daily trending `motion_story` Short
    - cron: "30 3 * * *"
    # Slot 2 (9:00 PM IST / 15:30 UTC): 1x daily trending `ai_faceless` Short
    - cron: "30 15 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "jagnor-clipping-company"
  cancel-in-progress: false

jobs:
  run-clipping-company:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # 4-Brain Free AI Council (100% Free-Tier Stack)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # 2 Free Visual APIs for Motion-Animated Faceless Shorts
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # Gmail SMTP Reporting Secrets
      COMPANY_GMAIL: ${{ secrets.COMPANY_GMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
      # Media & Social Publishing Secrets (Isolated per company)
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
      PUBLIC_VIDEO_BASE_URL: ${{ secrets.PUBLIC_VIDEO_BASE_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
      WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libmagic1 fonts-dejavu-core fonts-noto-core fonts-noto-cjk fonts-indic

      - name: Install Python Dependencies (yt-dlp + faster-whisper CPU + edge-tts + OpenCV + Pillow)
        run: |
          python3 -m pip install --upgrade pip
          # NOTE: mediapipe is intentionally NOT installed. Current releases dropped `mp.solutions` and pull in
          # opencv-contrib-python, which clashes with opencv-python-headless and breaks cv2 face data files.
          # The worker uses OpenCV Haar face tracking (auto-downloads its model) and falls back to a centered crop.
          pip install "yt-dlp[default]" faster-whisper edge-tts opencv-python-headless pillow numpy

      - name: Step 1 — Run 4-Brain Free AI Council & Render 9:16 Short to public/
        if: ${{ github.event.inputs.stage == 'build' || github.event.inputs.stage == 'full' || github.event_name == 'schedule' }}
        env:
          INPUT_ENGINE: ${{ github.event.inputs.engine || 'motion_story' }}
          INPUT_URL: ${{ github.event.inputs.source_url }}
          INPUT_NICHE: ${{ github.event.inputs.niche_query || 'AI agents automation tech podcast' }}
          INPUT_TREND_PLAT: ${{ github.event.inputs.trend_platform || 'auto' }}
          INPUT_TITLE: ${{ github.event.inputs.title_or_topic }}
          INPUT_NOTES: ${{ github.event.inputs.notes_or_points }}
          INPUT_PRICE: ${{ github.event.inputs.price_usd || '17' }}
          INPUT_ART_STYLE: ${{ github.event.inputs.art_style || 'original' }}
          INPUT_ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio || '9:16' }}
          INPUT_THEME: ${{ github.event.inputs.theme || 'Universal Storytelling' }}
          INPUT_CHARACTER: ${{ github.event.inputs.character_desc }}
          INPUT_VOICE: ${{ github.event.inputs.voice || 'deep_male' }}
          INPUT_ALLOW_ALL: ${{ github.event.inputs.allow_all_licenses }}
        run: |
          ALLOW_FLAG=""
          if [ "$INPUT_ALLOW_ALL" = "true" ]; then
            ALLOW_FLAG="--allow-all-licenses"
          fi

          AUTO_TOPIC_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            AUTO_TOPIC_FLAG="--auto-topic"
            if [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
              INPUT_ENGINE="ai_faceless"
              INPUT_ART_STYLE="dark_cinematic"
              INPUT_THEME="Trending Tech, AI & World Breakthroughs"
            else
              INPUT_ENGINE="motion_story"
              INPUT_ART_STYLE="anime"
              INPUT_THEME="Trending Science, Space & Untold Stories"
            fi
          elif [ -z "$INPUT_TITLE" ] && { [ "$INPUT_ENGINE" = "motion_story" ] || [ "$INPUT_ENGINE" = "ai_faceless" ]; }; then
            AUTO_TOPIC_FLAG="--auto-topic"
          fi

          CLEAN_PRICE=$(echo "${INPUT_PRICE:-17}" | tr -cd '0-9.')
          CLEAN_PRICE="${CLEAN_PRICE:-17}"

          python3 jagnor_master_worker.py \
            --stage build \
            --engine "$INPUT_ENGINE" \
            --url "$INPUT_URL" \
            --niche "$INPUT_NICHE" \
            --trend-platform "$INPUT_TREND_PLAT" \
            --title "$INPUT_TITLE" \
            --client "$INPUT_TITLE" \
            --notes "$INPUT_NOTES" \
            --price "$CLEAN_PRICE" \
            --art-style "$INPUT_ART_STYLE" \
            --aspect-ratio "$INPUT_ASPECT_RATIO" \
            --theme "$INPUT_THEME" \
            --character "$INPUT_CHARACTER" \
            --voice "$INPUT_VOICE" \
            --device auto \
            --model base \
            --job-dir ./jobs/latest \
            --brain-dir ./brain \
            --public-dir ./public \
            --inbox-dir ./inbox_videos \
            $ALLOW_FLAG \
            $AUTO_TOPIC_FLAG

      - name: Step 2 — Prune Old Media & Commit Rendered Short to public/ (with .nojekyll)
        if: ${{ github.event.inputs.stage == 'build' || github.event.inputs.stage == 'full' || github.event_name == 'schedule' }}
        run: |
          mkdir -p public brain jobs/latest
          touch .nojekyll public/.nojekyll
          if [ ! -f "public/index.html" ]; then
            echo "<html><body><h1>Jagnor Clipping AI Media Host</h1></body></html>" > public/index.html
          fi
          ls -t public/*.mp4 2>/dev/null | tail -n +16 | xargs -r rm -f
          ls -t public/*.png public/*.jpg public/*.zip 2>/dev/null | tail -n +61 | xargs -r rm -f
          rm -f jobs/latest/source.* jobs/latest/dropped_source.mp4 jobs/latest/audio_16k.wav jobs/latest/.yt_cookies.txt
          git config user.name "Jagnor Clipping Bot"
          git config user.email "actions@github.com"
          rm -f brain/*.lock jobs/latest/*.lock
          git add .nojekyll public/ brain/
          if [ -f "jobs/latest/manifest.json" ]; then
            git add jobs/latest/manifest.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(pipeline): export animated story short to public/ & update ledger [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort || true)
            git push origin HEAD:main || (git pull --rebase -X theirs origin main && git push origin HEAD:main)
          fi

      - name: Step 3 — Wait 45s for GitHub Pages CDN Propagation
        if: ${{ github.event.inputs.stage == 'publish' || github.event.inputs.stage == 'full' || github.event_name == 'schedule' }}
        run: sleep 45

      - name: Step 4 — Publish to YouTube Shorts & Instagram Reels
        if: ${{ github.event.inputs.stage == 'publish' || github.event.inputs.stage == 'full' || github.event_name == 'schedule' }}
        env:
          INPUT_SKIP_SPACING: ${{ github.event.inputs.skip_spacing_check }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run_publish }}
        run: |
          SPACING_FLAG=""
          if [ "$INPUT_SKIP_SPACING" = "true" ]; then
            SPACING_FLAG="--skip-spacing-check"
          fi

          DRY_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run-publish"
          fi

          PLATFORMS=""
          if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            PLATFORMS="youtube"
          fi
          if [ -n "$IG_USER_ID" ] && [ -n "$IG_ACCESS_TOKEN" ] && [ -n "$PUBLIC_VIDEO_BASE_URL" ]; then
            PLATFORMS="${PLATFORMS:+$PLATFORMS,}instagram"
          fi

          if [ -z "$DRY_FLAG" ] && [ -z "$PLATFORMS" ] && [ "${{ github.event.inputs.engine }}" != "b2b_agency" ]; then
            echo "No YouTube or Instagram secrets configured yet — skipping live upload cleanly (files are saved in public/)."
            exit 0
          fi

          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="youtube,instagram"
          fi

          python3 jagnor_master_worker.py \
            --stage publish \
            --approve-manifest \
            --platforms "$PLATFORMS" \
            --min-gap-hours 3.5 \
            --job-dir ./jobs/latest \
            --brain-dir ./brain \
            --public-dir ./public \
            $SPACING_FLAG \
            $DRY_FLAG

      - name: Step 5 — Commit Published Receipts to Company Brain Ledger
        if: ${{ github.event.inputs.stage == 'publish' || github.event.inputs.stage == 'full' || github.event_name == 'schedule' }}
        run: |
          git config user.name "Jagnor Clipping Bot"
          git config user.email "actions@github.com"
          rm -f brain/*.lock jobs/latest/*.lock
          git add brain/
          if [ -f "jobs/latest/manifest.json" ]; then
            git add jobs/latest/manifest.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(publish): log YouTube Shorts & Instagram Reels receipts [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort || true)
            git push origin HEAD:main || (git pull --rebase -X theirs origin main && git push origin HEAD:main)
          fi
          
