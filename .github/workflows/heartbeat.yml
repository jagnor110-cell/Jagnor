name: Autonomous AI Company Heartbeat

on:
  schedule:
    - cron: '30 2 * * *' # Runs automatically every day at 8:00 AM IST (02:30 UTC)
  workflow_dispatch:      # Lets you tap "Run workflow" manually on your phone

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run_company:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Open Factory Workspace
        uses: actions/checkout@v6

      - name: 2. Set Up Python & FFmpeg Movie Maker
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install playwright edge-tts pillow
          playwright install --with-deps chromium

      - name: 3. Wake Up the 6 AI Robots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_VIDEO_BASE_URL: ${{ secrets.PUBLIC_VIDEO_BASE_URL }}
          COMPANY_GMAIL: ${{ secrets.COMPANY_GMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 full_circle_company.py

      - name: 4. Save Built App, Zip & 9x16 Video to Repo
        run: |
          git config user.name "AI-Company-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ dist/
          git diff --staged --quiet || git commit -m "Daily AI Company Build"
          git push

      - name: 5. Upload public/ Folder to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 6. Deploy Live Website
        id: deployment
        uses: actions/deploy-pages@v4
        
