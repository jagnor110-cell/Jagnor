<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<title>MRR Pulse</title>
<style>
  :root {
    --bg: #07090f;
    --surface: #111625;
    --surface-2: #192136;
    --border: rgba(255,255,255,0.08);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --green: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: #030408;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
  }
  .phone-frame {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    background: radial-gradient(circle at top right, rgba(56,189,248,0.12), transparent 45%),
                radial-gradient(circle at bottom left, rgba(129,140,248,0.12), transparent 45%),
                var(--bg);
    padding: 20px 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(56,189,248,0.14);
    color: var(--accent);
    border: 1px solid rgba(56,189,248,0.25);
  }
  .hero-kpi {
    background: linear-gradient(145deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .kpi-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .hero-value {
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 4px 0 2px;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .kpi-subval {
    font-size: 1.35rem;
    font-weight: 700;
    margin-top: 4px;
    color: var(--text);
  }
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .prog-row { display: flex; flex-direction: column; gap: 6px; }
  .prog-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .prog-head span:last-child { color: var(--accent); }
  .track {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .fill.green {
    background: linear-gradient(90deg, #10b981, var(--green));
  }
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .slider-group { display: flex; flex-direction: column; gap: 8px; }
  .slider-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .slider-val {
    font-variant-numeric: tabular-nums;
    background: var(--surface-2);
    padding: 3px 9px;
    border-radius: 8px;
    color: var(--accent);
    border: 1px solid var(--border);
    font-size: 0.82rem;
  }
  input[type='range'] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    outline: none;
  }
  input[type='range']::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 12px rgba(56,189,248,0.6);
    cursor: pointer;
  }
  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: auto;
  }
  .preset-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .preset-btn.active, .preset-btn:active {
    background: rgba(56,189,248,0.15);
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <main class='phone-frame'>
    <header>
      <div class='brand'><span class='dot'></span>MRR Pulse</div>
      <span class='badge'>Live Forecast</span>
    </header>

    <section class='hero-kpi'>
      <div class='kpi-label'>Projected Monthly Revenue</div>
      <div class='hero-value' id='mrrDisplay'>$0</div>
      <div class='kpi-label' style='color: var(--green); font-size: 0.72rem;' id='dailyRevDisplay'>+$0 / day</div>
    </section>

    <section class='kpi-grid'>
      <div class='kpi-card'>
        <div class='kpi-label'>Annual Run Rate</div>
        <div class='kpi-subval' id='arrDisplay'>$0</div>
      </div>
      <div class='kpi-card'>
        <div class='kpi-label'>Paying Users</div>
        <div class='kpi-subval' id='usersDisplay'>0</div>
      </div>
    </section>

    <section class='progress-section'>
      <div class='prog-row'>
        <div class='prog-head'>
          <span>$10k MRR Freedom Goal</span>
          <span id='mrrPct'>0%</span>
        </div>
        <div class='track'><div class='fill green' id='mrrBar'></div></div>
      </div>
      <div class='prog-row'>
        <div class='prog-head'>
          <span>$100k ARR Milestone</span>
          <span id='arrPct'>0%</span>
        </div>
        <div class='track'><div class='fill' id='arrBar'></div></div>
      </div>
    </section>

    <section class='controls'>
      <div class='slider-group'>
        <div class='slider-top'>
          <span>Monthly Visitors</span>
          <span class='slider-val' id='visitorsVal'>5,000</span>
        </div>
        <input type='range' id='visitors' min='500' max='50000' step='500' value='5000'>
      </div>

      <div class='slider-group'>
        <div class='slider-top'>
          <span>Conversion Rate</span>
          <span class='slider-val' id='convVal'>2.5%</span>
        </div>
        <input type='range' id='conv' min='0.5' max='12' step='0.1' value='2.5'>
      </div>

      <div class='slider-group'>
        <div class='slider-top'>
          <span>Plan Price / mo</span>
          <span class='slider-val' id='priceVal'>$19</span>
        </div>
        <input type='range' id='price' min='5' max='149' step='1' value='19'>
      </div>
    </section>

    <section class='presets'>
      <button class='preset-btn active' onclick='applyPreset(5000, 2.5, 19, this)'>Indie Launch</button>
      <button class='preset-btn' onclick='applyPreset(30000, 1.8, 15, this)'>Viral Spike</button>
      <button class='preset-btn' onclick='applyPreset(2500, 4.5, 79, this)'>B2B Pro</button>
    </section>
  </main>

  <script>
    const elVisitors = document.getElementById('visitors');
    const elConv = document.getElementById('conv');
    const elPrice = document.getElementById('price');

    const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const fmtNum = new Intl.NumberFormat('en-US');

    function update() {
      const visitors = Number(elVisitors.value);
      const conv = Number(elConv.value);
      const price = Number(elPrice.value);

      const users = Math.round(visitors * (conv / 100));
      const mrr = users * price;
      const arr = mrr * 12;
      const daily = Math.round(mrr / 30);

      document.getElementById('visitorsVal').textContent = fmtNum.format(visitors);
      document.getElementById('convVal').textContent = conv.toFixed(1) + '%';
      document.getElementById('priceVal').textContent = '$' + price;

      document.getElementById('mrrDisplay').textContent = fmt.format(mrr);
      document.getElementById('dailyRevDisplay').textContent = '+' + fmt.format(daily) + ' / day';
      document.getElementById('arrDisplay').textContent = fmt.format(arr);
      document.getElementById('usersDisplay').textContent = fmtNum.format(users);

      const mrrGoalPct = Math.min(100, Math.round((mrr / 10000) * 100));
      const arrGoalPct = Math.min(100, Math.round((arr / 100000) * 100));

      document.getElementById('mrrPct').textContent = mrrGoalPct + '%';
      document.getElementById('mrrBar').style.width = mrrGoalPct + '%';
      document.getElementById('arrPct').textContent = arrGoalPct + '%';
      document.getElementById('arrBar').style.width = arrGoalPct + '%';
    }

    function clearActivePreset() {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    function applyPreset(v, c, p, btn) {
      elVisitors.value = v;
      elConv.value = c;
      elPrice.value = p;
      clearActivePreset();
      if (btn) btn.classList.add('active');
      update();
    }

    [elVisitors, elConv, elPrice].forEach(input => {
      input.addEventListener('input', () => {
        clearActivePreset();
        update();
      });
    });

    update();
  </script>
</body>
</html>
